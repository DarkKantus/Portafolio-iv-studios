<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Portal de Kael</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/footer.css" />
</head>
<body>
  <img class="galaxy-sparkles" src="assets/img/Fondos/main-bg.svg" alt="" aria-hidden="true" />
  <div id="app">

    <!-- =========================
         ENCABEZADO SUPERIOR
         Cambia dinámicamente al pasar por cada nodo
         ========================= -->
    <header class="site-header">
      <h1>Portal de Kael</h1>
      <p class="site-subtitle">Artes, oficios y mundos de un caballero moderno</p>
    </header>

    <main class="site-main">

      <!-- =========================
           FONDO DINÁMICO
           Cambia según el nodo en hover
           ========================= -->
      <div class="portal-bg"></div>

      <!-- =========================
           MENÚ RADIAL
           Conserva el círculo, líneas, posiciones y efectos
           ========================= -->
      <section class="radial-menu" aria-label="Portal radial de proyectos">

        <!-- SVG de órbita y conexiones -->
        <svg class="radial-orbit" viewBox="0 0 100 100" aria-hidden="true"></svg>

        <!-- =========================
             NÚCLEO CENTRAL
             Muestra imagen contextual al pasar por cada nodo
             ========================= -->
        <a href="sobre-mi.html" class="radial-core" aria-label="Ir a Sobre mí">
          <img class="core-default" src="assets/web/img/Core/core-nativo.webp" alt="Kael" />
          <img class="core-logo" src="" alt="" />
        </a>

        <!-- =========================
             NODOS RADIALES
             Cada nodo usa su identidad o un nombre tipográfico.
             ========================= -->

        <!-- BATTLECHAMP ARENA -->
        <a
          class="radial-item radial-item--logo"
          href="bca.html"
          data-section="bca"
          data-title="Battlechamp Arena"
          data-subtitle="Juego de mesa RPG medieval"
          data-bg="assets/web/img/Fondos/fondo-bca.webp"
          data-core-logo="assets/web/img/Core/core-bca.webp"
          aria-label="Ir a Battlechamp Arena"
        >
          <img src="assets/icon/bca-logo.svg" class="icon" alt="Battlechamp Arena" />
          <span class="radial-label">Battlechamp Arena</span>
        </a>

        <!-- PERDIDOS EN MARTE -->
        <a
          class="radial-item radial-item--logo"
          href="pem.html"
          data-section="pem"
          data-title="Perdidos en Marte"
          data-subtitle="Juego cooperativo de supervivencia espacial"
          data-bg="assets/web/img/Fondos/fondo-pem.webp"
          data-core-logo="assets/web/img/Core/core-pem.webp"
          aria-label="Ir a Perdidos en Marte"
        >
          <img src="assets/icon/pem-logo-b.svg" class="icon" alt="Perdidos en Marte" />
          <span class="radial-label">Perdidos en Marte</span>
        </a>

        <!-- VIDEOJUEGOS / PROTOTIPOS -->
        <a
          class="radial-item radial-item--logo"
          href="videojuegos.html"
          data-section="videojuegos"
          data-title="Videojuegos"
          data-subtitle="Prototipos jugables y mundos interactivos"
          data-bg="assets/web/img/Fondos/FONDO-FINAL.webp"
          data-core-logo="assets/web/img/Core/core-videojuegos.webp"
          aria-label="Ir a Videojuegos y prototipos"
        >
          <img src="assets/icon/icon-videojuegos.png" class="icon" alt="Videojuegos" />
          <span class="radial-label">Videojuegos</span>
        </a>

        <!-- LABORATORIO -->
        <a
          class="radial-item radial-item--logo"
          href="laboratorio.html"
          data-section="laboratorio"
          data-title="Laboratorio"
          data-subtitle="Ideas, prototipos, IA y registros de exploración"
          data-bg="assets/web/img/Fondos/fondo-lab.webp"
                    data-core-logo="assets/web/img/Core/core-lab.webp"
          aria-label="Ver Laboratorio"
        >
          <img src="assets/icon/icon-laboratorio.png" class="icon" alt="Laboratorio" />
          <span class="radial-label">Laboratorio</span>
        </a>

        <!-- ESTUDIO -->
                <a
                  class="radial-item radial-item--logo"
                  href="multimedia.html"
                  data-section="estudio"
                  data-title="Estudio"
                  data-subtitle="YouTube, música, canto, piano, edición y streams"
                  data-bg="assets/web/img/Fondos/fondo-multimedia.webp"
                            data-core-logo="assets/web/img/Core/core-multi.webp"
                  aria-label="Ver Estudio"
                >
                  <img src="assets/icon/icon-multimedia.png" class="icon" alt="Estudio" />
                  <span class="radial-label">Estudio</span>
                </a>

        <!-- ARTE / DISEÑO VISUAL -->
        <a
          class="radial-item radial-item--logo"
          href="arte.html"
          data-section="arte-diseno"
          data-title="Arte / Diseño visual"
          data-subtitle="Ilustración, UI, logos, concept art y piezas seleccionadas"
          data-bg="assets/web/img/Fondos/fondo-arte.webp"
          data-core-logo="assets/web/img/Core/core-arte.webp"
          aria-label="Ver Arte y Diseño visual"
        >
          <img src="assets/icon/icon-arte.png" class="icon" alt="Arte / Diseño visual" />
          <span class="radial-label">Arte / Diseño visual</span>
        </a>
      </section>
    </main>

        <!-- =========================
         PIE DE PÁGINA
         ========================= -->
    
    <footer class="site-footer" aria-label="Información de IV Studios">
  <div class="footer-brand">IV Studios <span>— Ignacio Vergara Moraga</span></div>
  <div class="footer-meta">Portafolio v1.1 <span aria-hidden="true">·</span> Julio 2026</div>
  <div class="footer-rights">Todos los derechos reservados</div>
</footer>
  </div>

  <script src="js/main.js"></script>
</body>
  </html>
