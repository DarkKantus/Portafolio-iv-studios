<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arte / Diseño visual</title>
  <link rel="stylesheet" href="css/skeleton.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/responsive.css?v=1.2-mobile-general-1" />
</head>
<body class="art-page">
  <main class="oneshot-shell">
    <header class="oneshot-topbar">
      <a class="skeleton-back" href="index.html">↩ Portal</a>
      <div class="oneshot-hero">
        <p class="oneshot-kicker">Galería temática</p>
        <h1>Arte / Diseño visual</h1>
      </div>
    </header>

    <section class="oneshot-stage art-stage" aria-label="Categorías de arte y diseño">
      <article class="oneshot-panel art-panel">
        <nav class="oneshot-tabs" aria-label="Temas de galería">
          <button class="oneshot-tab is-active" type="button" data-art="personajes">Personajes</button>
          <button class="oneshot-tab" type="button" data-art="locaciones">Locaciones</button>
          <button class="oneshot-tab" type="button" data-art="diseno">Diseño</button>
          <button class="oneshot-tab" type="button" data-art="marcas">Marcas</button>
        </nav>

        <div class="art-gallery-wrap">
          <button class="art-gallery__nav art-gallery__nav--prev" type="button" aria-label="Ver obras anteriores">‹</button>
          <div class="art-gallery" id="artGallery" aria-live="polite"></div>
          <button class="art-gallery__nav art-gallery__nav--next" type="button" aria-label="Ver obras siguientes">›</button>
        </div>

        <div class="art-copy">
          <h2 id="artTitle">Personajes</h2>
          <p id="artDescription">Ilustraciones y arte digital hecho a lo largo de los años. Algunos para proyectos, otros por entretenimiento.</p>
        </div>
      </article>
    </section>
  </main>

  <div class="art-lightbox" id="artLightbox" hidden>
    <button class="art-lightbox__close" type="button" aria-label="Cerrar imagen">×</button>
    <button class="art-lightbox__nav art-lightbox__nav--prev" type="button" aria-label="Imagen anterior">‹</button>
    <img src="" alt="" />
    <button class="art-lightbox__nav art-lightbox__nav--next" type="button" aria-label="Imagen siguiente">›</button>
    <p></p>
  </div>

  <script>
    const artPools = {
      personajes: {
        title: 'Personajes',
        description: 'Ilustraciones y arte digital hecho a lo largo de los años. Algunos para proyectos, otros por entretenimiento.',
        works: [
          ['assets/web/img/Arte y diseño/Personajes/Concepto 30DF - Personaje Grace.webp', 'Concepto 30DF — Personaje Grace'],
          ['assets/web/img/Arte y diseño/Personajes/Concepto 30DF - Retratos psicológicos.webp', 'Concepto 30DF — Retratos psicológicos'],
          ['assets/web/img/Arte y diseño/Personajes/Ballestera Naomi.webp', 'Ballestera Naomi'],
          ['assets/web/img/Arte y diseño/Personajes/BCA - León.webp', 'BCA — León'],
          ['assets/web/img/Arte y diseño/Personajes/BCA - Lobo.webp', 'BCA — Lobo'],
          ['assets/web/img/Arte y diseño/Personajes/BCA - Recolor exclusivo de Asesino.webp', 'BCA — Recolor exclusivo de Asesino'],
          ['assets/web/img/Arte y diseño/Personajes/Concepto - Animé occidental.webp', 'Concepto — Animé occidental'],
          ['assets/web/img/Arte y diseño/Personajes/Concepto - Astróscopo.webp', 'Concepto — Astróscopo'],
          ['assets/web/img/Arte y diseño/Personajes/DarkNaxx.webp', 'DarkNaxx'],
          ['assets/web/img/Arte y diseño/Personajes/Dibujo Guerrera.webp', 'Dibujo Guerrera'],
          ['assets/web/img/Arte y diseño/Personajes/La Musa.webp', 'La Musa'],
          ['assets/web/img/Arte y diseño/Personajes/k3.webp', 'K3'],
          ['assets/web/img/Arte y diseño/Personajes/Lancero.webp', 'Lancero'],
          ['assets/web/img/Arte y diseño/Personajes/PeM - Aberraciones descontroladas.webp', 'PeM — Aberraciones descontroladas'],
          ['assets/web/img/Arte y diseño/Personajes/PeM - Avatar Astronauta.webp', 'PeM — Avatar Astronauta'],
          ['assets/web/img/Arte y diseño/Personajes/PeM - Insectoide.webp', 'PeM — Insectoide'],
          ['assets/web/img/Arte y diseño/Personajes/PeM - Mente Colmena.webp', 'PeM — Mente Colmena']
        ]
      },
      locaciones: {
        title: 'Locaciones',
        description: 'Paisajes de distintos tipos hechos generalmente para los proyectos de Perdidos en Marte (temática espacial realista) y BattleChamp Arena Campaing (dibujos temática medieval).',
        works: [
          ['assets/web/img/Arte y diseño/Locaciones/BCA - Bosque Traidor.webp', 'BCA — Bosque Traidor'],
          ['assets/web/img/Arte y diseño/Locaciones/BCA - Castillo Ruinoso.webp', 'BCA — Castillo Ruinoso'],
          ['assets/web/img/Arte y diseño/Locaciones/BCA - Molino.webp', 'BCA — Molino'],
          ['assets/web/img/Arte y diseño/Locaciones/Concepto - Astróscopo.webp', 'Concepto — Astróscopo'],
          ['assets/web/img/Arte y diseño/Locaciones/Arte Wallpaper.webp', 'Arte Wallpaper'],
          ['assets/web/img/Arte y diseño/Locaciones/PeM - Concepto Nevado.webp', 'PeM — Concepto Nevado'],
          ['assets/web/img/Arte y diseño/Locaciones/PeM - Deimos a la vista.webp', 'PeM — Deimos a la vista'],
          ['assets/web/img/Arte y diseño/Locaciones/PeM - Depósito.webp', 'PeM — Depósito'],
          ['assets/web/img/Arte y diseño/Locaciones/PeM - Estacion solar en ruinas.webp', 'PeM — Estacion solar en ruinas'],
          ['assets/web/img/Arte y diseño/Locaciones/PeM - Último Bastión de la Humanidad.webp', 'PeM — Último Bastión de la Humanidad']
        ]
      },
      diseno: {
        title: 'Diseño',
        description: 'Breve muestra de trabajos de distintos tipos: afiches, posters, interfaces, material promocional.',
        works: [
          ['assets/web/img/Arte y diseño/Diseño/Afiche Universitario Antidiscriminación.webp', 'Afiche Universitario — Antidiscriminación'],
          ['assets/web/img/Arte y diseño/Diseño/Alfa de Ukronía- Juego de Cartas histórico.webp', 'Alfa de Ukronía — Juego de Cartas histórico'],
          ['assets/web/img/Arte y diseño/Diseño/BCA - Siluetas.webp', 'BCA — Siluetas'],
          ['assets/web/img/Arte y diseño/Diseño/Concepto promocional para BCA.webp', 'Concepto promocional para BCA'],
          ['assets/web/img/Arte y diseño/Diseño/Etiqueta pyme - Amor y lanas.webp', 'Etiqueta pyme — Amor y lanas'],
          ['assets/web/img/Arte y diseño/Diseño/Foto - Battlechamp Arena.webp', 'Foto — Battlechamp Arena'],
          ['assets/web/img/Arte y diseño/Diseño/Foto - Caja de BattleChamp Arena.webp', 'Foto — Caja de BattleChamp Arena'],
          ['assets/web/img/Arte y diseño/Diseño/Foto - Escudo de madera simple.webp', 'Foto — Escudo de madera simple'],
          ['assets/web/img/Arte y diseño/Diseño/Miniatura para Youtube - DmC realidad desde el limbo.webp', 'Miniatura para YouTube — DmC: realidad desde el limbo'],
          ['assets/web/img/Arte y diseño/Diseño/Portada Catálogo textil.webp', 'Portada Catálogo textil'],
          ['assets/web/img/Arte y diseño/Diseño/Portada revista 90+10.webp', 'Portada revista 90+10'],
          ['assets/web/img/Arte y diseño/Diseño/Portada revista Bocetos.webp', 'Portada revista Bocetos'],
          ['assets/web/img/Arte y diseño/Diseño/Poster Cinematográfico.webp', 'Poster Cinematográfico'],
          ['assets/web/img/Arte y diseño/Diseño/Poster Social.webp', 'Poster Social'],
          ['assets/web/img/Arte y diseño/Diseño/Posterior de la caja - BCA.webp', 'Posterior de la caja — BCA'],
          ['assets/web/img/Arte y diseño/Diseño/Principios herméticos.webp', 'Principios herméticos'],
          ['assets/web/img/Arte y diseño/Diseño/Proceso creativo de BCA.webp', 'Proceso creativo de BCA'],
          ['assets/web/img/Arte y diseño/Diseño/Render 3D - BCA.webp', 'Render 3D — BCA'],
          ['assets/web/img/Arte y diseño/Diseño/Screenshot de Inicio de Stream.webp', 'Screenshot de Inicio de Stream'],
          ['assets/web/img/Arte y diseño/Diseño/Tatuaje Tribal.webp', 'Tatuaje Tribal'],
          ['assets/web/img/Arte y diseño/Diseño/Trabajo sobre madera - Triqueta.webp', 'Trabajo sobre madera — Triqueta'],
          ['assets/web/img/Arte y diseño/Diseño/Trabajo sobre piedra - Grabado artesanal.webp', 'Trabajo sobre piedra — Grabado artesanal'],
          ['assets/web/img/Arte y diseño/Diseño/UI PeM - Beta.webp', 'UI PeM — Beta'],
          ['assets/web/img/Arte y diseño/Diseño/Vetorizado para laser.webp', 'Vetorizado para laser']
        ]
      },
      marcas: {
        title: 'Marcas',
        description: 'Breve muestra de Material Licenciado y de autoría propia.',
        works: [
          ['assets/web/img/Arte y diseño/Marcas/Afiche Becker.webp', 'Afiche Becker'],
          ['assets/web/img/Arte y diseño/Marcas/Afiche Vercorizado - Skyrim.webp', 'Afiche Vercorizado — Skyrim'],
          ['assets/web/img/Arte y diseño/Marcas/Ejemplo de Encargo - Logo.webp', 'Ejemplo de Encargo — Logo'],
          ['assets/web/img/Arte y diseño/Marcas/Heráldica familiar.webp', 'Heráldica familiar'],
          ['assets/web/img/Arte y diseño/Marcas/Logo BattleChamp Arena.webp', 'Logo BattleChamp Arena'],
          ['assets/web/img/Arte y diseño/Marcas/Logo IV studios.webp', 'Logo IV studios'],
          ['assets/web/img/Arte y diseño/Marcas/Logo PEM.webp', 'Logo PEM'],
          ['assets/web/img/Arte y diseño/Marcas/Tríptico - Diablo inmortal, frontal.webp', 'Tríptico — Diablo inmortal, frontal'],
          ['assets/web/img/Arte y diseño/Marcas/Tríptico - Diablo inmortal, interior.webp', 'Tríptico — Diablo inmortal, interior']
        ]
      }
    };

    const gallery = document.getElementById('artGallery');
    const title = document.getElementById('artTitle');
    const description = document.getElementById('artDescription');
    const galleryPrevButton = document.querySelector('.art-gallery__nav--prev');
    const galleryNextButton = document.querySelector('.art-gallery__nav--next');
    const lightbox = document.getElementById('artLightbox');
    const lightboxImg = lightbox.querySelector('img');
    const lightboxCaption = lightbox.querySelector('p');
    const prevButton = lightbox.querySelector('.art-lightbox__nav--prev');
    const nextButton = lightbox.querySelector('.art-lightbox__nav--next');
    let currentPoolKey = 'personajes';
    let currentImageIndex = 0;
    let galleryStartIndex = 0;
    const gallerySize = 4;

    function fileTitle(src) {
      return src.split('/').pop().replace(/\.[^.]+$/, '');
    }

    function showLightboxImage(index) {
      const works = artPools[currentPoolKey].works;
      currentImageIndex = (index + works.length) % works.length;
      const [src] = works[currentImageIndex];
      const caption = fileTitle(src);
      lightboxImg.src = src;
      lightboxImg.alt = caption;
      lightboxCaption.textContent = caption;
    }

    function openLightbox(index) {
      showLightboxImage(index);
      lightbox.hidden = false;
    }

    function renderArt(key, resetGallery = true) {
      currentPoolKey = key;
      if (resetGallery) galleryStartIndex = 0;
      const pool = artPools[key];
      const works = pool.works;
      title.textContent = pool.title;
      description.textContent = pool.description;
      const visibleWorks = Array.from(
        { length: Math.min(gallerySize, works.length) },
        (_, offset) => ({ work: works[(galleryStartIndex + offset) % works.length], index: (galleryStartIndex + offset) % works.length })
      );
      gallery.innerHTML = visibleWorks.map(({ work: [src], index }) => {
        const caption = fileTitle(src);
        return `
          <button class="art-preview" type="button" data-index="${index}" aria-label="Ampliar: ${caption}">
            <img src="${src}" alt="${caption}">
            <span class="art-preview__caption">${caption}</span>
          </button>
        `;
      }).join('');
      const canNavigate = works.length > gallerySize;
      galleryPrevButton.disabled = !canNavigate;
      galleryNextButton.disabled = !canNavigate;
      gallery.querySelectorAll('.art-preview').forEach((button) => {
        button.addEventListener('click', () => openLightbox(Number(button.dataset.index)));
      });
    }

    function moveGallery(direction) {
      const works = artPools[currentPoolKey].works;
      galleryStartIndex = (galleryStartIndex + direction + works.length) % works.length;
      renderArt(currentPoolKey, false);
    }

    document.querySelectorAll('[data-art]').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('[data-art]').forEach((item) => item.classList.toggle('is-active', item === tab));
        renderArt(tab.dataset.art);
      });
    });
    galleryPrevButton.addEventListener('click', () => moveGallery(-1));
    galleryNextButton.addEventListener('click', () => moveGallery(1));
    function closeLightbox() { lightbox.hidden = true; lightboxImg.src = ''; }
    function showPrevImage() { showLightboxImage(currentImageIndex - 1); }
    function showNextImage() { showLightboxImage(currentImageIndex + 1); }
    lightbox.querySelector('.art-lightbox__close').addEventListener('click', closeLightbox);
    prevButton.addEventListener('click', showPrevImage);
    nextButton.addEventListener('click', showNextImage);
    lightbox.addEventListener('click', (event) => { if (event.target === lightbox) closeLightbox(); });
    window.addEventListener('keydown', (event) => {
      if (lightbox.hidden) return;
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') showPrevImage();
      if (event.key === 'ArrowRight') showNextImage();
    });
    renderArt('personajes');
  </script>

<footer class="site-footer" aria-label="Información de IV Studios">

  <div class="footer-rights">Todos los derechos reservados</div>
</footer>
</body>
</html>
